<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#181b26" />
  <title>格子漫游 · Grid Walker</title>

  <link rel="stylesheet" href="style.css" />

  <!--
    依赖异步加载器（顺序：p5 → SharedRoom 联机库（mqtt.min.js + net.js）→ sketch.js）：
    · 每个 CDN 源最多等 7 秒（防止网络屏蔽时页面被同步 script 卡死）；
    · 失败自动换下一个源（jsdelivr → unpkg → cdnjs）；
    · 每一步在页面底部状态行显示可见进度（加载阶段 / 成功 / 错误）；
    · p5 必需；mqtt.min.js / net.js 是本地文件（SharedRoom 联机层，
      复用 DECIDER Phase2 旧项目的 MQTT 房间方案），失败也继续（游戏降级为单机模式）；
    · p5 与 sketch.js 全部就绪后，setup() 必定执行且只执行一次：
      优先使用 p5 自身的 load 事件自动初始化（它自带 p5.instance 防重复判断），
      仅当 load 已过去、自动初始化未生效时才手动 new p5()，并用
      window.__gameStarted / p5.instance / 画布存在性三重判断防止重复实例；
    · 不依赖任何固定延迟启动游戏（8 秒看门狗仅用于诊断报错）。
  -->
  <script>
    (function () {
      'use strict';

      var CDN = {
        'p5': [
          'https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js',
          'https://unpkg.com/p5@1.9.4/lib/p5.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js'
        ]
      };
      var TIMEOUT = 7000;   // 单个 CDN 尝试超时（毫秒）

      /* 页面级启动状态：整个启动流程只执行一次 */
      var p5Ready = false;
      var sketchReady = false;
      var booted = false;           // 依赖就绪后的启动流程只执行一次
      var instanceCreated = false;  // 手动 new p5() 只允许一次

      /* ---------- 状态行（缓冲式：loader 在 <head> 中运行时 #net-status 尚未解析） ---------- */
      var STATUS_COLOR = { info: '#ffd166', ok: '#7ee787', warn: '#f0c674', err: '#ff7b72' };
      var lastStatus = { text: '加载中…', kind: 'info' };
      function applyStatus() {
        var el = document.getElementById('net-status');
        if (!el) return;
        el.textContent = lastStatus.text;
        el.style.color = STATUS_COLOR[lastStatus.kind] || STATUS_COLOR.info;
      }
      function status(text, kind) {
        lastStatus = { text: text, kind: kind || 'info' };
        applyStatus();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyStatus);
      } else {
        applyStatus();
      }

      function loadScript(url) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          var done = false;
          var timer = setTimeout(function () {
            if (done) return;
            done = true;
            s.onload = s.onerror = null;
            try { s.remove(); } catch (e) {}
            reject(new Error('超时: ' + url.replace('https://', '')));
          }, TIMEOUT);
          s.onload = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            resolve();
          };
          s.onerror = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            try { s.remove(); } catch (e) {}
            reject(new Error('失败: ' + url.replace('https://', '')));
          };
          s.src = url;
          document.head.appendChild(s);
        });
      }

      function loadChain(name) {
        var urls = CDN[name];
        var i = 0;
        function next() {
          if (i >= urls.length) {
            return Promise.reject(new Error(name + ' 所有 CDN 源均加载失败'));
          }
          var url = urls[i++];
          status('正在加载 ' + name + '… 第 ' + i + '/' + urls.length + ' 个源');
          return loadScript(url).catch(next);
        }
        return next();
      }

      /* ---------- 启动游戏：setup() 只执行一次、p5 实例只创建一次 ---------- */
      function startGameNow() {
        // 三重判断：setup 已执行过 / p5 已有全局实例 / 画布已存在 → 绝不重复创建
        if (window.__gameStarted ||
            (typeof p5 !== 'undefined' && p5.instance) ||
            document.querySelector('#canvas-container canvas')) {
          return;
        }
        if (instanceCreated) return;
        instanceCreated = true;
        status('创建 p5 实例…');
        try {
          new p5();
          status('游戏已启动 ✓', 'ok');
        } catch (e) {
          status('初始化失败: ' + (e && e.message ? e.message : e) + ' · 请刷新重试', 'err');
        }
      }

      function onDependenciesReady() {
        if (booted) return;
        if (!p5Ready || !sketchReady) return;
        if (typeof window.setup !== 'function') {
          status('初始化失败: sketch.js 未定义 setup() · 请刷新重试', 'err');
          booted = true;
          return;
        }
        booted = true;
        if (document.readyState === 'complete') {
          // window load 已过去：p5 的自动初始化当时看不到 setup()，必须手动创建
          startGameNow();
        } else {
          // load 未到：p5 会在 load 时自行创建实例（此刻 setup() 已就绪）。
          // 本监听器只做兜底——setTimeout(0) 让 p5 的自动初始化先执行，
          // 若它没生效（无实例、无画布、setup 没跑）再手动补建。
          window.addEventListener('load', function () {
            setTimeout(startGameNow, 0);
          });
        }
        // 看门狗（仅诊断报错，不用固定延迟启动游戏）
        setTimeout(function () {
          if (!window.__gameStarted) {
            status('初始化未完成：游戏未启动 · 请刷新重试（持续出现请检查网络）', 'warn');
          }
        }, 8000);
      }

      status('加载中…');
      loadChain('p5')
        .then(function () {
          p5Ready = true;
          status('p5.js 加载成功 ✓', 'ok');
          // 诊断模式（?debug=local / #debug=local / sessionStorage debug=local）：
          // 跳过 SharedRoom 联机层，彻底排除联机与网络的影响
          var isDebug = false;
          try { isDebug = sessionStorage.getItem('debug') === 'local'; } catch (e) {}
          if (!isDebug) isDebug = /[?&]debug=local/.test(location.search) || /debug=local/.test(location.hash);
          if (isDebug) {
            status('诊断模式: 跳过联机库 · 不访问服务器', 'warn');
            return Promise.resolve();
          }
          // SharedRoom 联机层（本地文件，复用 DECIDER Phase2 的 MQTT 房间方案）
          return loadScript('js/vendor/mqtt.min.js?v=1')
            .then(function () {
              if (typeof mqtt === 'undefined' || typeof mqtt.connect !== 'function') {
                throw new Error('mqtt.min.js 未导出 mqtt 全局变量');
              }
              status('联机库 mqtt.min.js 加载成功 ✓', 'ok');
              return loadScript('js/net.js?v=1');
            })
            .then(function () {
              if (typeof netConnect !== 'function' || typeof netInit !== 'function') {
                throw new Error('net.js 未定义 netInit()/netConnect()');
              }
              status('联机层 net.js 加载成功 ✓', 'ok');
            })
            .catch(function (err) {
              status('警告: 联机库未加载（' + (err && err.message ? err.message : err) + '）· 将使用单机模式', 'warn');
            });
        })
        .then(function () {
          status('正在加载 sketch.js…');
          return loadScript('sketch.js?v=7');
        })
        .then(function () {
          sketchReady = true;
          status('sketch.js 加载成功 ✓', 'ok');
          onDependenciesReady();
        })
        .catch(function (err) {
          status('初始化失败: ' + (err && err.message ? err.message : err) + ' · 请检查网络后刷新', 'err');
        });
    })();
  </script>
</head>
<body>
  <div id="game">
    <!-- p5 画布挂载点（只显示角色附近的地图区域） -->
    <div id="canvas-container"></div>

    <!-- 初始化/联机状态行：加载进度、JOIN 反馈、错误信息都在这里可见 -->
    <div id="net-status">加载中…</div>

    <!-- 操作区：联机 + 开始 + 校准 + 备用方向按钮 -->
    <div id="controls">
      <div id="control-top">
        <button id="btn-join" class="cal-btn" aria-label="加入共享房间">JOIN</button>
        <button id="btn-start" class="cal-btn" aria-label="开始游戏">START</button>
        <button id="btn-calibrate" class="cal-btn" aria-label="校准倾斜传感器">CALIBRATE</button>
      </div>
      <div id="dpad">
        <button id="btn-up"    class="dir-btn" aria-label="上">▲</button>
        <button id="btn-left"  class="dir-btn" aria-label="左">◀</button>
        <button id="btn-down"  class="dir-btn" aria-label="下">▼</button>
        <button id="btn-right" class="dir-btn" aria-label="右">▶</button>
      </div>
    </div>
  </div>

  <!-- sketch.js 由上面的加载器在依赖就绪后加载，不在此处同步加载 -->
</body>
</html>
